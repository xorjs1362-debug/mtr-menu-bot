name: Cafeteria menu OCR v2

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '55 1 * * 1-5'
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  menu:
    if: github.event_name != 'issues' || github.event.issue.title == 'RUN MENU BOT'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install runtime
        run: |
          set +e
          sudo apt-get update > install-v2.log 2>&1
          sudo apt-get install -y tesseract-ocr tesseract-ocr-kor >> install-v2.log 2>&1
          python -m pip install --upgrade pip >> install-v2.log 2>&1
          pip install -r requirements.txt >> install-v2.log 2>&1
          echo "install_exit_code=$?" >> install-v2.log
          cat install-v2.log
          exit 0

      - name: Discover Kakao feed API
        run: |
          set +e
          python scripts/discover_kakao_api.py > discover-v2.log 2>&1
          echo "discover_exit_code=$?" >> discover-v2.log
          cat discover-v2.log
          exit 0

      - name: Fetch and OCR
        run: |
          set +e
          python scripts/fetch_menu.py > run-v2.log 2>&1
          echo "exit_code=$?" >> run-v2.log
          cat run-v2.log
          exit 0

      - name: Publish result to output issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## Cafeteria menu bot output"
            echo
            echo "- workflow_time_utc: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            echo "- event: $GITHUB_EVENT_NAME"
            echo
            if [ -f latest_menu.txt ]; then
              echo '```text'
              cat latest_menu.txt
              echo '```'
            fi
            echo
            echo "### Kakao API discovery"
            echo '```text'
            tail -n 180 discover-v2.log 2>/dev/null || true
            echo '```'
            echo
            echo "### Run log tail"
            echo '```text'
            tail -n 100 run-v2.log 2>/dev/null || true
            echo '```'
            echo
            echo "### Install log tail"
            echo '```text'
            tail -n 20 install-v2.log 2>/dev/null || true
            echo '```'
          } > issue-body.md
          gh issue edit 1 --repo "$GITHUB_REPOSITORY" --body-file issue-body.md

      - name: Close trigger issue
        if: always() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --comment "Menu bot run finished. See issue #1 for the result." || true
