name: Cafeteria menu OCR v2

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '55 1 * * 1-5'
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  menu:
    if: github.event_name != 'issues' || github.event.issue.title == 'RUN MENU BOT'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Cache EasyOCR Korean model
        uses: actions/cache@v4
        with:
          path: .easyocr-models
          key: easyocr-ko-en-v1

      - name: Install runtime
        run: |
          sudo apt-get update > install-v2.log 2>&1
          sudo apt-get install -y tesseract-ocr tesseract-ocr-kor >> install-v2.log 2>&1
          python -m pip install --upgrade pip >> install-v2.log 2>&1
          pip install --prefer-binary -r requirements.txt >> install-v2.log 2>&1
          echo "install_exit_code=0" >> install-v2.log
          tail -n 30 install-v2.log

      - name: Fetch and OCR
        run: |
          set +e
          python scripts/fetch_menu_vertical.py > run-v2.log 2>&1
          code=$?
          echo "exit_code=$code" >> run-v2.log
          cat run-v2.log
          exit 0

      - name: Publish result to output issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## Cafeteria menu bot output"
            echo
            echo "- workflow_time_utc: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            echo "- event: $GITHUB_EVENT_NAME"
            echo
            if [ -f latest_menu.txt ]; then
              echo '```text'
              cat latest_menu.txt
              echo '```'
            else
              echo "### Menu result was not created"
            fi
            echo
            echo "### Run log tail"
            echo '```text'
            tail -n 120 run-v2.log 2>/dev/null || true
            echo '```'
          } > issue-body.md
          gh issue edit 1 --repo "$GITHUB_REPOSITORY" --body-file issue-body.md

      - name: Close trigger issue
        if: always() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --comment "Menu bot run finished. See issue #1 for the result." || true
