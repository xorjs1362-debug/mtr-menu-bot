name: Fetch cafeteria menu

on:
  schedule:
    - cron: '55 1 * * 1-5'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'requirements.txt'

permissions:
  contents: write

jobs:
  fetch-menu:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install OCR runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-kor python3-pip
          python3 -m pip install requests==2.32.3 Pillow==11.3.0 pytesseract==0.3.13

      - name: Run direct Microlink OCR diagnostic
        run: |
          set +e
          python3 scripts/diagnostic_ocr.py > diagnostic_run.log 2>&1
          echo "exit_code=$?" >> diagnostic_run.log
          cat diagnostic_run.log
          exit 0

      - name: Commit diagnostic result
        if: always()
        run: |
          git config user.name "mtr-menu-bot"
          git config user.email "actions@users.noreply.github.com"
          git add diagnostic_run.log diagnostic_result.txt data/diagnostic_menu.png 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No diagnostic changes"
          else
            git commit -m "Update direct OCR diagnostic"
            git push
          fi
