name: Fetch cafeteria menu

on:
  schedule:
    - cron: '55 1 * * 1-5'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'requirements.txt'
      - '.github/workflows/menu.yml'

permissions:
  contents: write

jobs:
  fetch-menu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install OCR and browser dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-kor
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run full menu pipeline
        run: |
          set +e
          python scripts/fetch_menu.py > run.log 2>&1
          code=$?
          echo "exit_code=$code" >> run.log
          cat run.log
          exit 0

      - name: Commit result and diagnostic files
        if: always()
        run: |
          git config user.name "mtr-menu-bot"
          git config user.email "actions@users.noreply.github.com"
          git add run.log latest_menu.json latest_menu.txt data/state.json data/latest_menu.png 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No result changes"
          else
            git commit -m "Update cafeteria menu pipeline result"
            git push
          fi
