<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f6fed">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="할 일">
<title>프로젝트 할 일 체크리스트</title>
<link rel="manifest" href="./manifest.webmanifest?v=32">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="stylesheet" href="./style.css?v=32">
<link rel="stylesheet" href="./sticky-columns.css?v=32">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="auth-loading">
<button id="installBtn" type="button" style="position:fixed;top:12px;right:12px;z-index:10000;border:0;border-radius:10px;padding:9px 13px;background:#2f6fed;color:#fff;font-weight:800;box-shadow:0 6px 18px rgba(47,111,237,.28);cursor:pointer">앱 설치</button>

<section id="loginScreen" class="login-screen">
  <div class="login-card">
    <div class="brand">PRIVATE TODO</div>
    <h1>프로젝트 할 일 체크리스트</h1>
    <p>등록된 본인 계정으로 로그인해야 내용을 확인하거나 수정할 수 있습니다.</p>
    <label>이메일</label><input id="loginEmail" type="email" autocomplete="username" placeholder="이메일">
    <label>비밀번호</label><input id="loginPassword" type="password" autocomplete="current-password" placeholder="비밀번호">
    <button id="loginBtn" class="primary full">로그인</button>
    <div id="loginError" class="error"></div>
  </div>
</section>

<main id="app" class="app">
  <header>
    <div><h1>프로젝트 할 일 체크리스트</h1><div id="syncText" class="muted">온라인 자동 저장</div></div>
    <div class="header-actions"><span id="currentUserEmail" class="user"></span><button id="logoutBtn">로그아웃</button><button id="manageProjectsBtn">프로젝트 관리</button><button id="exportBtn">백업</button><button id="importBtn">불러오기</button><input id="fileInput" type="file" accept=".json,application/json" hidden></div>
  </header>

  <section class="tabs-panel"><div id="tabs" class="tabs"></div></section>

  <section class="panel composer">
    <h2>새 할 일 추가</h2>
    <div class="form-grid">
      <div class="field task"><label>할 일</label><input id="newTitle" placeholder="예: 도면 수정 후 협력사 전달"></div>
      <div class="field"><label>프로젝트</label><select id="newProject"></select></div>
      <div class="field"><label>상태</label><select id="newStatus"><option value="doing" selected>진행중</option><option value="wait">대기</option><option value="done">완료</option></select></div>
      <div class="field"><label>우선순위</label><select id="newPriority"><option value="high">높음</option><option value="mid" selected>보통</option><option value="low">낮음</option></select></div>
      <div class="field"><label>작성일</label><input id="newCreatedDate" type="date"></div>
      <div class="field due"><label>마감일</label><input id="newDueDate" type="date"><small id="newDuePreview"></small></div>
      <button id="addBtn" class="primary add">추가</button>
    </div>
  </section>

  <section class="metrics">
    <div><span>현재 탭 전체</span><b id="mTotal">0</b></div><div><span>진행중</span><b id="mDoing">0</b></div><div><span>대기</span><b id="mWait">0</b></div><div><span>기한 초과</span><b id="mOverdue">0</b></div><div><span>완료율</span><b id="mRate">0%</b><i><em id="progressBar"></em></i></div>
  </section>

  <section class="panel">
    <div class="toolbar"><input id="search" placeholder="업무 제목 또는 메모 검색"><select id="filterStatus"><option value="all">상태 전체</option><option value="doing">진행중</option><option value="wait">대기</option><option value="done">완료</option><option value="overdue">기한 초과</option></select><select id="sort"><option value="manual">사용자 지정순</option><option value="due">마감일순</option><option value="created-desc">작성일 최신순</option><option value="created-asc">작성일 오래된순</option><option value="priority">우선순위순</option><option value="status">상태순</option><option value="project">프로젝트순</option></select></div>
    <div class="table-wrap"><table><thead><tr><th>완료</th><th>할 일</th><th>프로젝트</th><th>상태</th><th>우선순위</th><th>작성일</th><th>마감일</th><th>관리</th></tr></thead><tbody id="taskBody"></tbody></table><div id="emptyState" class="empty" hidden>표시할 할 일이 없습니다.</div></div>
    <footer><span id="visibleInfo">0개 표시</span><button id="clearDoneBtn">완료 항목 정리</button></footer>
  </section>
</main>

<div id="editBackdrop" class="backdrop"><div class="modal"><div class="modal-head"><h2>할 일 수정</h2><button id="editCloseBtn">×</button></div><div class="edit-grid">
  <div class="field wide"><label>할 일</label><input id="editTitle"></div>
  <div class="field"><label>프로젝트</label><select id="editProject"></select></div>
  <div class="field"><label>상태</label><select id="editStatus"><option value="doing">진행중</option><option value="wait">대기</option><option value="done">완료</option></select></div>
  <div class="field"><label>우선순위</label><select id="editPriority"><option value="high">높음</option><option value="mid">보통</option><option value="low">낮음</option></select></div>
  <div></div><div class="field"><label>작성일</label><input id="editCreatedDate" type="date"></div><div class="field due"><label>마감일</label><input id="editDueDate" type="date"><small id="editDuePreview"></small></div>
  <div class="field wide"><label>메모</label><textarea id="editMemo" placeholder="세부 내용이나 참고사항"></textarea></div>
</div><div class="modal-foot"><button id="editDeleteBtn" class="danger">삭제</button><div><button id="editCancelBtn">취소</button><button id="editSaveBtn" class="primary">저장</button></div></div></div></div>

<div id="projectBackdrop" class="backdrop"><div class="modal"><div class="modal-head"><h2>프로젝트 관리</h2><button id="projectCloseBtn">×</button></div><div class="project-add"><input id="projectNameInput" placeholder="새 프로젝트 이름"><button id="addProjectBtn" class="primary">추가</button></div><div id="projectList" class="project-list"></div><div class="modal-foot end"><button id="projectDoneBtn">닫기</button></div></div></div>

<script src="./app.js?v=32"></script>
<script src="./app-overrides.js?v=32"></script>
<script src="./completion-tracking.js?v=32"></script>
<script src="./manual-order.js?v=32"></script>
<script src="./mobile-layout-fix.js?v=32"></script>
<script src="./project-tab-order.js?v=32"></script>
<script src="./title-linebreak-fix.js?v=32"></script>
<script src="./weekly-report.js?v=32"></script>
<script src="./weekly-mobile-fix.js?v=32"></script>
<script src="./weekly-link-button.js?v=32"></script>
<script src="./archive-tasks.js?v=32"></script>
<script src="./pwa-install.js?v=32"></script>
</body>
</html>
